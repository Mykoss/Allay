name: Apply flight authorization fix

on:
  push:
    branches:
      - fix/survival-flight-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch setFlying authorization
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/src/main/java/org/allaymc/server/entity/component/player/EntityPlayerBaseComponentImpl.java")
          text = path.read_text()
          old = '''    @Override\n    public void setFlying(boolean flying) {\n        if (this.flying != flying) {\n            this.flying = flying;\n            if (isActualPlayer()) {\n                this.controller.setAbility(PlayerAbility.FLYING, flying);\n            }\n        }\n    }'''
          new = '''    @Override\n    public void setFlying(boolean flying) {\n        // Never allow an actual player to enter the flying state unless the\n        // server currently authorizes flight. This is the final server-side\n        // guard against client double-jump/START_FLYING desynchronization.\n        if (flying && isActualPlayer() && !this.controller.canFly()) {\n            return;\n        }\n\n        if (this.flying != flying) {\n            this.flying = flying;\n            if (isActualPlayer()) {\n                this.controller.setAbility(PlayerAbility.FLYING, flying);\n            }\n        }\n    }'''
          if old not in text:
              raise SystemExit("Expected setFlying implementation was not found; refusing to modify the file")
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-flight-fix.yml
          git add server/src/main/java/org/allaymc/server/entity/component/player/EntityPlayerBaseComponentImpl.java .github/workflows/apply-flight-fix.yml
          git diff --cached --check
          git commit -m "fix: enforce flight authorization server-side"
          git push origin HEAD:fix/survival-flight-authority