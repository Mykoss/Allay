name: Allay Jar Build

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build shaded server jar
        run: |
          chmod +x gradlew
          ./gradlew :server:shadowJar

      - name: Find shaded jar
        id: jar
        run: |
          JAR=$(find server/build/libs -name "allay-server-*-shaded.jar" -print -quit)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: allay-server
          path: ${{ steps.jar.outputs.path }}
