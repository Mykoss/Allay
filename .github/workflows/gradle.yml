name: Allay

on:
  push:
    branches:
      - master
      - update/mcbe-1.26.52-v2193
    paths:
      - .github/workflows/gradle.yml
      - gradle/libs.versions.toml
      - gradle.properties
      - build.gradle.kts
      - settings.gradle.kts
      - protocol-local
      - stateupdater-local
      - api/**
      - server/**
      - data/**
  pull_request:
    paths:
      - .github/workflows/gradle.yml
      - gradle/libs.versions.toml
      - gradle.properties
      - build.gradle.kts
      - settings.gradle.kts
      - protocol-local
      - stateupdater-local
      - api/**
      - server/**
      - data/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_PREFIX: mcbe-1.26.52-v2193

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-overwrite-existing: true
          cache-read-only: false
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Generate Coverage Reports
        if: success()
        run: ./gradlew jacocoTestReport

      - name: Upload Coverage Reports to Codecov
        if: success()
        uses: codecov/codecov-action@v7.0.0
        with:
          directory: .jacoco/test/
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Prepare Shaded Jar
        if: success()
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHADED_JAR_PATH="$(find server/build/libs -name 'allay-server-*-shaded.jar' -print -quit)"
          if [[ -z "$SHADED_JAR_PATH" ]]; then
            echo "No shaded Allay JAR was produced."
            exit 1
          fi

          RELEASE_TAG="${RELEASE_PREFIX}-build-${GITHUB_RUN_NUMBER}"
          RELEASE_JAR_NAME="allay-server-${RELEASE_TAG}.jar"
          RELEASE_JAR_PATH="${RUNNER_TEMP}/${RELEASE_JAR_NAME}"

          cp "$SHADED_JAR_PATH" "$RELEASE_JAR_PATH"

          echo "shaded_jar_path=$SHADED_JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "release_jar_path=$RELEASE_JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "release_jar_name=$RELEASE_JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Jar Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.vars.outputs.release_jar_path }}
          archive: false

      - name: Create GitHub Tag and Prerelease
        if: success() && github.event_name != 'pull_request' && github.repository == 'Mykoss/Allay'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          RELEASE_JAR_PATH: ${{ steps.vars.outputs.release_jar_path }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Allay MCBE 1.26.52 / Protocol 2193 - Build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated test build from \`${GITHUB_REF_NAME}\` at commit \`${SHORT_SHA}\`. Build and automated tests completed successfully." \
              --prerelease
          fi
