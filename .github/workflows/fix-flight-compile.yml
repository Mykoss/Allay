name: Fix flight compile error

on:
  push:
    branches:
      - fix/flight-compile-error

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid EntityPlayer method call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/main/java/org/allaymc/server/world/physics/AllayEntityPhysicsEngine.java')
          s = p.read_text()
          old = 'player.getOriginName()'
          new = 'player.getRuntimeId()'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-flight-compile.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/main/java/org/allaymc/server/world/physics/AllayEntityPhysicsEngine.java .github/workflows/fix-flight-compile.yml
          git commit -m 'fix: correct flight debug log compilation' || exit 0
          git push