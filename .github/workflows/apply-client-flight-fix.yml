name: Apply client flight fix

on:
  push:
    branches: [fix/survival-client-flight]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch physics movement validation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('server/src/main/java/org/allaymc/server/world/physics/AllayEntityPhysicsEngine.java')
          s = p.read_text()
          marker = '''    protected boolean forceApplyMotion(Entity entity) {\n        var loc = new Location3d(entity.getLocation());\n        loc.add(((EntityPhysicsComponent) entity).getMotion());\n        return entity.trySetLocation(loc);\n    }\n\n'''
          helper = '''    protected boolean forceApplyMotion(Entity entity) {\n        var loc = new Location3d(entity.getLocation());\n        loc.add(((EntityPhysicsComponent) entity).getMotion());\n        return entity.trySetLocation(loc);\n    }\n\n    protected boolean isUnauthorizedFlightMovement(EntityPlayer player, EntityPlayerPhysicsComponentImpl physicsComponent, Vector3dc motion) {\n        if (player.getGameMode() != org.allaymc.api.player.GameMode.SURVIVAL || player.getController().canFly()) {\n            return false;\n        }\n\n        // A normal jump starts while grounded. Once airborne, its vertical velocity\n        // should decrease because gravity is applied by the client. A second jump\n        // (the reported double-jump flight) produces a clear upward velocity reset.\n        if (physicsComponent.isOnGround() || motion.y() <= 0 || physicsComponent.getLastMotion().y() <= 0) {\n            return false;\n        }\n\n        return motion.y() > physicsComponent.getLastMotion().y() + 0.05;\n    }\n\n'''
          if marker not in s:
              raise SystemExit('forceApplyMotion marker not found')
          if 'isUnauthorizedFlightMovement' not in s:
              s = s.replace(marker, helper, 1)
          old = '''                var motion = event.getTo().sub(player.getLocation(), new Vector3d());\n                var physicsComponent = ((EntityPlayerPhysicsComponentImpl) ((EntityPlayerImpl) player).getPhysicsComponent());\n                physicsComponent.setMotionValueOnly(motion);\n'''
          new = '''                var motion = event.getTo().sub(player.getLocation(), new Vector3d());\n                var physicsComponent = ((EntityPlayerPhysicsComponentImpl) ((EntityPlayerImpl) player).getPhysicsComponent());\n                if (isUnauthorizedFlightMovement(player, physicsComponent, motion)) {\n                    log.warn("Player {} attempted unauthorized client flight: vertical motion {} after {}", player.getOriginName(), motion.y(), physicsComponent.getLastMotion().y());\n                    physicsComponent.setMotionValueOnly(new Vector3d());\n                    player.setFlying(false);\n                    player.getController().viewPlayerAbilities(player.getController());\n                    continue;\n                }\n                physicsComponent.setMotionValueOnly(motion);\n'''
          if old not in s:
              raise SystemExit('movement marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/main/java/org/allaymc/server/world/physics/AllayEntityPhysicsEngine.java
          git diff --cached --check
          git commit -m "fix: reject unauthorized client flight movement"
          git push
          git rm .github/workflows/apply-client-flight-fix.yml
          git commit -m "ci: remove temporary flight fix workflow"
          git push
